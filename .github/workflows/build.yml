name: Locate Android Project

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          pwd
          ls -la
          find . -maxdepth 5 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \)
